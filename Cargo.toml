[package]
name = "haven-ui"
version = "0.1.0"
edition = "2024"
description = "Declarative UI crate for native Rust applications."
license-file = "LICENSE.md"
repository = "https://github.com/cyypherus/haven"

[lib]
name = "haven"

[[example]]
name = "buttons"
path = "examples/buttons.rs"
required-features = ["platform-winit"]

[[example]]
name = "scroller"
path = "examples/scroller.rs"
required-features = ["platform-winit"]

[[example]]
name = "image"
path = "examples/image.rs"
required-features = ["platform-winit"]

[[example]]
name = "async"
path = "examples/async.rs"
required-features = ["platform-winit"]

[[example]]
name = "productivity"
path = "examples/productivity.rs"
required-features = ["platform-winit"]

[[example]]
name = "gestures"
path = "examples/gestures.rs"
required-features = ["platform-winit"]

[[example]]
name = "text_fields"
path = "examples/text_fields.rs"
required-features = ["platform-winit"]

[[example]]
name = "effects"
path = "examples/effects.rs"
required-features = ["platform-winit"]

[dependencies]
backer = "0.12.0"
# backer = { path = "../backer" }
bytemuck = { version = "1", features = ["derive"] }
clipboard-rs = "0.3.0"
glifo = "0.2"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
kurbo = "0.13.0"
lilt = "0.8"
parley = "0.11.1"
peniko = "0.6.0"
pollster = "0.4"
vello_common = "0.1"
vello_hybrid = "0.1"
vello_svg = { version = "0.11", default-features = false }
wgpu = "29"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
winit = { version = "0.30.12", optional = true }

[features]
default = ["platform-winit"]
test-api = []
debug-overlay = ["platform-winit"]
platform-winit = ["dep:winit"]

[dev-dependencies]
arboard = "3.4"
insta = "1.42.1"
public-api = "0.52.2"
reqwest = { version = "0.13.5", features = ["json"] }
rustdoc-json = "0.9.9"
rustup-toolchain = "0.1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["fs"] }

[profile.dev.package."*"]
opt-level = 3
